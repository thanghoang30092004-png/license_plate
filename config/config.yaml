models:
  vehicle_detector: "yolo26n.pt"
  plate_detector: "D:/license_plate_data/model/license_plate_detector (1).pt"

detection:
  vehicle_conf_threshold: 0.2
  plate_conf_threshold: 0.1
  plate_min_ratio: 0.8
  plate_max_ratio: 5.0


tracking:
  max_age: 30
  n_init: 3
  embedder: "mobilenet"

ocr:
  use_gpu: true
  min_confidence: 0.4
  batch_size: 16
  det_model_path: r"D:\license_plate_data\model\PP-OCRv6_tiny_det.onnx"
  rec_model_path: r"D:\license_plate_data\model\PP-OCRv6_tiny_rec.onnx"
cache:
  min_frames_to_confirm: 3      # số frame vote trước khi khóa kết quả
  recheck_interval_found: 60    # đã có biển ổn định, bao lâu check lại 1 lần
  recheck_interval_missing: 15  # chưa tìm thấy biển, bao lâu thử lại

queue:
  frame_queue_size: 1
  result_queue_size: 5

video:
  source: "D:/license_plate_data/data/Camera Đọc Biển Số Xe, Giải pháp camera nhìn biển số xe của nhà imou.mp4"
  output: "output/anpr_output.mp4"
  fallback_fps: 30
